// Native Unity player (experimental): Unity's own ARM64 Android player running the game's C# on our
// ARM64 Mono through il2mono (a libil2cpp.so replacement). Research and plan:
// docs/research/unity-arm64-stepC-plan.md and docs/research/unity-native-integration-plan.md.
//
// Unity's binaries are not in the repository: tools/unity-native/prepare_unity_module.sh extracts them
// from Unity's Android Support package into unity/prepared/ (git-ignored). settings.gradle includes
// this module only when that folder exists, so builds without it are unaffected.
plugins {
    id 'com.android.library'
}

android {
    // Unity's classes look up their resources (R.id.unitySurfaceView, styles) in this namespace.
    namespace 'com.unity3d.player'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 30
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ['prepared/jniLibs']
            assets.srcDirs += ['prepared/assets']
        }
    }

    androidResources {
        // The player reads its data straight from the APK; keep the serialized files uncompressed.
        noCompress += ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp', '.assets', '.resS', '.json']
    }
}

dependencies {
    implementation files('prepared/libs/unity-classes.jar')
    implementation 'androidx.games:games-frame-pacing:1.10.0'
}
