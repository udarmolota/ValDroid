name: Build ValDroid APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Test MobileGlues capability filter
        run: |
          cc -std=c11 -Wall -Wextra -Werror app/src/test/native/mg_caps_test.c -o "$RUNNER_TEMP/mg_caps_test"
          "$RUNNER_TEMP/mg_caps_test"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
    
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          echo "Installing NDK..."
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      # Native engine (experimental): built only when the repository variable NATIVE_ENGINE is "true".
      # Unity's Android player comes straight from Unity's download server; it is unpacked and patched,
      # and the rest is generated or built from source (the bridge with Mono's C# compiler, against
      # Input System sources from Unity's package registry): tools/unity-native/prepare_unity_module.sh.
      # No Unity file is stored in this repository.
      - name: Cache Unity Android Support package
        if: vars.NATIVE_ENGINE == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unity-android-support.pkg
          key: unity-android-support-6000.0.75f1-26349cd2a5c8

      - name: Prepare the native engine module
        if: vars.NATIVE_ENGINE == 'true'
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/unity-android-support.pkg"
          [ -f "$PKG" ] || curl -fL --retry 3 -o "$PKG" \
            "https://download.unity3d.com/download_unity/26349cd2a5c8/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-6000.0.75f1.pkg"
          sudo apt-get update
          sudo apt-get install -y libarchive-tools mono-devel
          # The compiler is the .NET SDK's Roslyn (the bridge uses C# 9); Mono gives the references.
          CSC_DLL=$(ls /usr/share/dotnet/sdk/*/Roslyn/bincore/csc.dll | sort -V | tail -n 1)
          PYTHON=python3 TAR=bsdtar CSC="dotnet $CSC_DLL" MONO_API=/usr/lib/mono/4.5 \
            sh tools/unity-native/prepare_unity_module.sh "$PKG"
          echo "ORG_GRADLE_PROJECT_nativeEngine=true" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: valdroid-debug-${{ steps.app_version.outputs.name }}
          path: app/build/outputs/apk/debug/valdroid-debug-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: valdroid-release-${{ steps.app_version.outputs.name }}
          path: app/build/outputs/apk/release/valdroid-release-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30
