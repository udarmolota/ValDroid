name: Build ValDroid APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Test MobileGlues capability filter
        run: |
          cc -std=c11 -Wall -Wextra -Werror app/src/test/native/mg_caps_test.c -o "$RUNNER_TEMP/mg_caps_test"
          "$RUNNER_TEMP/mg_caps_test"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
    
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          echo "Installing NDK..."
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      # Native engine (experimental): built only when the repository variable NATIVE_ENGINE is "true".
      # Unity's Android player comes straight from Unity's download server; it is unpacked and patched,
      # and the rest is generated or built from source (the bridge with Mono's C# compiler, against
      # Input System sources from Unity's package registry): tools/unity-native/prepare_unity_module.sh.
      # No Unity file is stored in this repository.
      - name: Cache Unity Android Support package
        if: vars.NATIVE_ENGINE == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unity-android-support.pkg
          key: unity-android-support-6000.0.75f1-26349cd2a5c8

      - name: Cache PlayFab Party release
        if: vars.NATIVE_ENGINE == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/playfab-party-android.zip
          key: playfab-party-android-1.10.17

      - name: Prepare the native engine module
        if: vars.NATIVE_ENGINE == 'true'
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/unity-android-support.pkg"
          [ -f "$PKG" ] || curl -fL --retry 3 -o "$PKG" \
            "https://download.unity3d.com/download_unity/26349cd2a5c8/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-6000.0.75f1.pkg"
          PARTY_ZIP="$RUNNER_TEMP/playfab-party-android.zip"
          [ -f "$PARTY_ZIP" ] || curl -fL --retry 3 -o "$PARTY_ZIP" \
            "https://github.com/PlayFab/PlayFabParty/releases/download/v1.10.17/PlayFabParty.Android.Release.zip"
          export PARTY_ZIP
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          # The compiler is the .NET SDK's Roslyn (the bridge uses C# 9). The references are the Mono class
          # libraries Unity's player runs on (tools/unity-native/monoref, MIT): Ubuntu's Mono 6.8 describes
          # ReadOnlySpan in a way Roslyn refuses (CS0570) when the Input System is compiled against it.
          CSC_DLL=$(ls /usr/share/dotnet/sdk/*/Roslyn/bincore/csc.dll | sort -V | tail -n 1)
          PYTHON=python3 TAR=bsdtar CSC="dotnet $CSC_DLL" MONO_API="$GITHUB_WORKSPACE/tools/unity-native/monoref/4.5" \
            sh tools/unity-native/prepare_unity_module.sh "$PKG"
          echo "ORG_GRADLE_PROJECT_nativeEngine=true" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: valdroid-debug-${{ steps.app_version.outputs.name }}
          path: app/build/outputs/apk/debug/valdroid-debug-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

      # The release key, with the lineage from the old AOSP test key, so a release installs over any
      # earlier one (Android 9+, hence rotation from SDK 28). Pull requests get no secrets: unsigned.
      - name: Sign Release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APK: app/build/outputs/apk/release/valdroid-release-${{ steps.app_version.outputs.name }}.apk
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEY="$RUNNER_TEMP/release.p12"
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEY"
          "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --lineage tools/signing/valdroid.lineage --rotation-min-sdk-version 28 \r
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true "$APK"
          rm -f "$KEY"
          "$BT/apksigner" verify --print-certs --min-sdk-version 30 "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: valdroid-release-${{ steps.app_version.outputs.name }}
          path: app/build/outputs/apk/release/valdroid-release-${{ steps.app_version.outputs.name }}.apk
          retention-days: 30
